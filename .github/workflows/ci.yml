# Lint + unit tests (Vitest). Production build runs on Vercel — see docs/qa/test-infrastructure-review.md § CI build.
# Push triggers: include long-lived branches you commit to (e.g. develop) so CI
# runs even when you are not using a PR yet. PRs still run on any branch.
name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Unit tests
        run: npm run test
